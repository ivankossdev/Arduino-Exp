<!DOCTYPE html>
<html lang="ru">
<head>
    <title>ESP32-C3 Web Server</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
    <body>
        <div class="container">
            <h1>ESP32-C3 Web Server</h1>
            <h2>Управление светодиодом</h2>
            <div class="button-container">
                <button class="button button-on" onclick="setLED('on')">ВКЛ</button>
                <button class="button button-off" onclick="setLED('off')">ВЫКЛ</button>
            </div>
            <p>Состояние GPIO: <strong id="state">%STATE%</strong></p>

            <h2>Данные с датчика (пример)</h2>
            <p>
                <span class="sensor-label">Температура: </span>
                <span id="temperature">%TEMPERATURE%</span> °C
            </p>
            <p>
                <span class="sensor-label">Влажность: </span>
                <span id="humidity">%HUMIDITY%</span> %
            </p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
